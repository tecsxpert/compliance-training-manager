version: "3.8"

services:

  # ===== Spring Boot Application =====
  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: compliance-training-app
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - DB_URL=jdbc:postgresql://db:5432/compliance_db
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET=bXlTZWNyZXRLZXkxMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ=
      - JWT_EXPIRATION=86400000
    restart: on-failure
    networks:
      - compliance-net

  # ===== PostgreSQL Database =====
  db:
    image: postgres:14-alpine
    container_name: compliance-postgres
    restart: always
    environment:
      POSTGRES_DB: compliance_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d compliance_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - compliance-net

  # ===== Redis Cache =====
  redis:
    image: redis:7-alpine
    container_name: compliance-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - compliance-net

  # ===== PgAdmin (DB UI) =====
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: compliance-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@compliance.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    depends_on:
      - db
    networks:
      - compliance-net

volumes:
  postgres_data:
  redis_data:

networks:
  compliance-net:
    driver: bridge