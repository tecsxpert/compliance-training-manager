server:
  port: 8080

spring:
  application:
    name: compliance-training-manager

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/compliancedb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update   # ✅ change from validate (safe for dev)
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USER:noreply@example.com}
    password: ${MAIL_PASS:dummy}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

  redis:
    host: ${REDIS_HOST:localhost}   # ✅ fallback added
    port: 6379

  cache:
    type: redis   # ✅ explicitly set cache type

  security:
    user:
      name: admin
      password: admin123

jwt:
  secret: ${JWT_SECRET:myDefaultSecretKey12345678901234}
  expiration: 86400000

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

logging:
  level:
    org.springframework: INFO
    com.internship.tool: DEBUG