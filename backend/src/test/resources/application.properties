# =============================================
# Test Application Configuration (H2 in-memory)
# =============================================
spring.profiles.active=test

# --- H2 Datasource ---
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- JPA ---
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# --- Disable Flyway for tests ---
spring.flyway.enabled=false

# --- Simple cache (no Redis needed) ---
spring.cache.type=simple

# --- JWT (test secret) ---
jwt.secret=dGVzdFNlY3JldEtleTEyMzQ1Njc4OTAxMjM0NTY3ODkwMTIz
jwt.expiration=86400000

# --- Mail (disable for tests) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=test@test.com
spring.mail.password=testpass
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# --- Logging ---
logging.level.com.internship.tool=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN
